[package]
name = "lshell"
version = "1.3.0"
description = "Lshell - 轻量级 Windows SSH 客户端"
authors = ["xichengli"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "lshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
# 第二实例启动时唤出已有窗口，避免两个进程同时写同一个 SQLite 库
tauri-plugin-single-instance = "2"
# 自动更新：静态 latest.json + minisign 签名校验
tauri-plugin-updater = "2"
# 仅用于检查更新后读取安装包大小（HEAD Content-Length）。
# 与 updater 插件使用同一份 reqwest，特性取并集，不会新增编译单元。
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
] }
# 与 updater 插件使用同一份 rustls；启动时安装 ring provider，
# 供上面 HEAD 请求使用（reqwest 的 rustls-no-provider 不带默认 provider）
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SSH 协议栈：必须锁定精确版本，russh API 不稳定，升级需走独立分支做回归
#
# 加密后端选择 ring 而非默认的 aws-lc-rs：
# aws-lc-sys 在 Windows 上编译需要 NASM 汇编器，会给每个构建者增加一个
# 额外工具链依赖。ring 在 Windows 上使用预生成的汇编，无需 NASM。
# 对个人 SSH 客户端而言，ring 的性能与安全特性完全够用。
russh = { version = "=0.65.0", default-features = false, features = [
  "flate2",
  "ring",
  "rsa",
] }
russh-sftp = "=3.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "fs"] }
bytes = "1"
futures = "0.3"

# 本地存储
rusqlite = { version = "0.41", features = ["bundled"] }
directories = "6"

# 加密
#
# 主密钥由 Windows DPAPI 保管（见 src/dpapi.rs，直接声明 Win32 FFI，
# 不引入 windows crate 以避免上万个 API 绑定的编译开销）。
aes-gcm = { version = "0.11", features = ["getrandom"] }
rand = "0.10"
zeroize = { version = "1", features = ["derive"] }

# 远程文件编辑：基线哈希与读取方向的 base64 内容封装（纯 Rust，无 C 依赖）
sha2 = "0.10"
base64 = "0.22"

thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
